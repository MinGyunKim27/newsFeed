name: CI/CD Pipeline

on:
  push:
    branches: [ develop ]

env:
  APP_NAME: newsFeed               # 원하는 JAR 파일명 prefix (예: newsfeed, ticketing 등)
  DEPLOY_DIR: /home/ubuntu/app          # EC2에 업로드할 경로
  JAR_DIR: build/libs                   # JAR 파일 빌드 경로

jobs:
  build:
    name: Build with Gradle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build the project
        run: ./gradlew build --no-daemon

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}
          path: ${{ env.JAR_DIR }}/*.jar

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APP_NAME }}

      - name: SCP JAR to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "*.jar"
          target: ${{ env.DEPLOY_DIR }}

      - name: SSH and restart application
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            [ -f ${{ env.DEPLOY_DIR }}/.env ] && export $(cat ${{ env.DEPLOY_DIR }}/.env | xargs)
            pkill -f 'java -jar' || true
            cd ${{ env.DEPLOY_DIR }}
            setsid nohup java -jar $(ls -t *.jar | head -n1) > app.log 2>&1 &

      
